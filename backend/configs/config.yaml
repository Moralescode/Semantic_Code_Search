# CodeMind - Configuration Globale du Projet

model:
  base_model_name: "prajjwal1/bert-tiny"  # Modèle de base léger pour le hackathon MVP (repli possible sur d'autres modèles)
  finetuned_model_path: "models/saved_biencoder"
  use_lora: true
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.1

retrieval:
  index_path: "data/faiss_index.index"
  baseline_index_path: "data/faiss_baseline.index"
  mapping_path: "data/faiss_mapping.json"
  top_k: 20
  rerank_top_k: 5
  similarity_threshold: 0.1

training:
  batch_size: 16
  epochs: 3
  learning_rate: 2e-5
  max_seq_length: 128
  train_samples: 100
  val_samples: 20

dataset:
  raw_data_dir: "data/raw"
  processed_jsonl: "data/processed_corpus.jsonl"
  cache_embeddings_dir: "embeddings"

cross_encoder:
  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  fallback_model_name: "prajjwal1/bert-tiny"

llm:
  provider: "ollama" # Options: "mock", "openai", "deepseek", "ollama", "qwen"
  api_key: ""
  base_url: "http://localhost:11434"
  model_name: "codellama:7b"
  temperature: 0.3
  max_tokens: 1024

elevenlabs:
  api_key: "sk_1f6c1c6a6a13169750737700942c451b0a64241613585aa2"
  default_voice_id: "EXAVITQu4vrRV9E3zY0"
  model_id: "eleven_monolingual_v1"
  stability: 0.5
  similarity_boost: 0.75
  style: 0.3
  use_speaker_boost: true


security:
  allowed_languages: ["python", "javascript", "go", "java", "php", "ruby"]
  max_code_length: 5000
